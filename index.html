<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>AI Essay Assistant</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/base.css">
</head>

<body>

    <!-- Loading screen: shown until Firebase says whether someone is signed
         in, so a signed-in student never sees a flash of the login form. -->
    <div id="loading-screen">
        <p id="loading-text" class="tool-hint">Loading…</p>
    </div>

    <!-- Login screen -->
    <div id="login-screen" style="display:none;">
        <div class="auth-card">
            <h1>AI Essay Assistant</h1>

            <p id="auth-error" class="auth-error" role="alert" style="display:none;"></p>

            <form id="auth-form" novalidate>
                <label for="auth-email">Email</label>
                <input type="email" id="auth-email" placeholder="you@example.com"
                    autocomplete="email" autocapitalize="none" spellcheck="false">

                <label for="auth-password">Password</label>
                <input type="password" id="auth-password" placeholder="At least 6 characters"
                    autocomplete="current-password">

                <button type="submit" id="auth-submit" class="btn-primary auth-submit">Sign In</button>
            </form>

            <p class="auth-toggle">
                <span id="auth-toggle-text">Don't have an account?</span>
                <a href="#" id="auth-toggle-link">Create one</a>
            </p>

            <div class="auth-divider"><span>or</span></div>

            <button type="button" id="auth-google" class="btn-secondary auth-google">Continue with Google</button>
        </div>
    </div>

    <!-- Home screen: the student's templates and documents (home.js) -->
    <div id="home-screen" style="display:none;">
        <div class="home-header">
            <h1>AI Essay Assistant</h1>
            <div class="home-header-actions">
                <button id="home-create" type="button" class="btn-primary">Create Document</button>
                <button id="home-sign-out" type="button" class="btn-secondary">Sign Out</button>
                <button type="button" class="help-btn" data-help="home"
                    title="How this screen works" aria-label="How this screen works"
                    aria-haspopup="dialog" aria-expanded="false">?</button>
            </div>
        </div>

        <div class="home-subheader">
            <div class="view-toggle" role="group" aria-label="Show">
                <button type="button" id="home-view-templates" class="view-toggle-btn" aria-pressed="false">Templates</button>
                <button type="button" id="home-view-documents" class="view-toggle-btn view-toggle-active" aria-pressed="true">Documents</button>
            </div>
            <p id="home-user" class="home-user"></p>
        </div>

        <div id="home-list"></div>
    </div>

    <!-- Template wizard screens A, B, and C. Built in Phase 4. -->
    <div id="wizard-screen" style="display:none;">
        <p class="tool-hint">Template wizard (Phase 4).</p>
    </div>

    <!-- Template editor, reached from the Home menu. Placeholder until Phase 4
         (placeholders.js). -->
    <div id="template-editor-screen" style="display:none;">
        <div class="placeholder-card">
            <button type="button" id="template-placeholder-home" class="btn-secondary">← Home</button>
            <h2 id="template-placeholder-title"></h2>
            <p id="template-placeholder-info" class="tool-hint"></p>
            <p class="tool-hint">The template editor is built in Phase 4.</p>
        </div>
    </div>

    <!-- Document editor. Placeholder until Phase 5 (placeholders.js). -->
    <div id="editor-screen" style="display:none;">
        <div class="placeholder-card">
            <button type="button" id="editor-placeholder-home" class="btn-secondary">← Home</button>
            <h2 id="editor-placeholder-title"></h2>
            <p id="editor-placeholder-info" class="tool-hint"></p>
            <p class="tool-hint">The editor is built in Phase 5.</p>
        </div>
    </div>

    <script type="module" src="app.js" id="app-script"></script>

    <!-- Startup watchdog. If the app's scripts fail to load or crash while
         starting, say why on the loading screen instead of showing
         "Loading…" forever (this also covers devices with no console, like
         the iPad). It stays quiet once the app has started. -->
    <script>
        (function () {
            function loadingScreenIsUp() {
                var loading = document.getElementById("loading-screen");
                return loading && loading.style.display !== "none";
            }

            function showStartupError(detail) {
                if (!loadingScreenIsUp()) return;
                document.getElementById("loading-text").textContent =
                    "The app couldn't start. " + detail;
                console.error("STARTUP:", detail);
            }

            // A file in the app's module graph couldn't be fetched (404, blocked, offline).
            document.getElementById("app-script").addEventListener("error", function () {
                showStartupError("One of its files didn't load. Check that every file is uploaded to the right folder, then hard-refresh (Ctrl+Shift+R).");
            });

            // A file loaded but failed while starting (a syntax error, a missing export, a crash).
            window.addEventListener("error", function (e) {
                showStartupError(e.message || "Unknown error.");
            });
            window.addEventListener("unhandledrejection", function (e) {
                showStartupError(String((e.reason && e.reason.message) || e.reason));
            });

            // Nothing failed, but nothing finished either (usually a lost connection).
            setTimeout(function () {
                if (loadingScreenIsUp() && document.getElementById("loading-text").textContent === "Loading…") {
                    document.getElementById("loading-text").textContent =
                        "Still loading… Check your connection, then refresh the page.";
                }
            }, 10000);
        })();
    </script>
</body>

</html>
